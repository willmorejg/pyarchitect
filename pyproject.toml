[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyarchitect"
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4.4",
    "duckdb-engine>=0.17.0",
    "pandas>=3.0.0",
    "pyarrow>=23.0.0",
    "pydantic>=2.12.5",
    "pytz>=2025.2",
    "sqlalchemy>=2.0.46",
    "sqlmodel>=0.0.31",
    "structlog>=25.5.0",
]

[tool.hatch.version]
path = "src/mods/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["mods"]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "bumpver>=2025.1131",
    "flake8>=7.3.0",
    "ipython>=9.9.0",
    "isort>=7.0.0",
    "mypy>=1.19.1",
    "pydocstringformatter>=0.7.5",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.14",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.pydocstringformatter]
write = true
exclude = "**/.github/**,**/.pytest_cache/**,**/__pycache__/**,**/.ruff_cache/**,**/.venv/**,**/vscode/**,**/logs/**"
strip-whitespaces = true
split-summary-body = false

[tool.ruff]
# Set line length
line-length = 88
# Set minimum Python version
target-version = "py312"
# Exclude specific directories
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".venv",
    "__pycache__",
    "node_modules",
]

[tool.ruff.lint]
# Enable specific rule sets
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "I",    # isort
    "D",    # pydocstyle (docstring conventions)
]
# Ignore specific rules
ignore = [
    "E501",  # line too long
    "B008",  # do not perform function calls in argument defaults
    "D100",  # missing docstring in public module
    "D104",  # missing docstring in public package
]

# Allow fixing specific rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"
# Indent with spaces
indent-style = "space"
# Use trailing commas
skip-magic-trailing-comma = false
# Auto-detect line ending
line-ending = "auto"
# Enable code formatting in docstrings
docstring-code-format = true

[tool.bumpver]
current_version = "0.1.0"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "bump version {old_version} -> {new_version}"
tag_message = "v{new_version}"
tag_scope = "default"
"pyproject.toml" = ['current_version = "{version}"']
"src/mods/__init__.py" = ['__version__ = "{version}"']
