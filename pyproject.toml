[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyarchitect"
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.5",
    "structlog>=25.5.0",
]

[tool.hatch.version]
path = "src/mods/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["mods"]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "bumpver>=2025.1131",
    "flake8>=7.3.0",
    "ipython>=9.9.0",
    "isort>=7.0.0",
    "mypy>=1.19.1",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.14",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
# Set line length
line-length = 88
# Set minimum Python version
target-version = "py312"
# Exclude specific directories
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".venv",
    "__pycache__",
    "node_modules",
]

[tool.ruff.lint]
# Enable specific rule sets
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "I",    # isort
]
# Ignore specific rules
ignore = [
    "E501",  # line too long
    "B008",  # do not perform function calls in argument defaults
]
# Allow fixing specific rules
fixable = ["ALL"]
unfixable = []
[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"
# Indent with spaces
indent-style = "space"
# Use trailing commas
skip-magic-trailing-comma = false
# Auto-detect line ending
line-ending = "auto"

[tool.bumpver]
current_version = "0.1.0"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "bump version {old_version} -> {new_version}"
tag_message = "v{new_version}"
tag_scope = "default"
"pyproject.toml" = ['current_version = "{version}"']
"src/mods/__init__.py" = ['__version__ = "{version}"']
